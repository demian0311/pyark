# Built by install/site.sh into store/site. docs/reference.md is generated there, not here.
# Look: the slate palette (https://diagrammo.app/slate/), tokens in docs/assets/slate.css.
site_name: pyark
site_url: http://localhost:8800/
use_directory_urls: true
theme:
  name: material
  font: false                 # fonts are vendored in assets/fonts; nothing loads from Google
  icon: { logo: material/package-variant-closed }
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light }
  features: [navigation.sections, navigation.footer, navigation.top, navigation.tracking, toc.follow, search.highlight, content.code.copy]
extra_css: [assets/slate.css]
extra_javascript: [assets/ref-filter.js]
nav:
  - Home: index.md
  - Start a project: start-a-project.md
  - Add a library or tool: add-a-library.md
  - Working offline: offline.md
  - Tools: tools.md
  - Editor (nvim): nvim.md
  - Reference docs: reference.md
  - Search all docs: find.md
plugins: [search]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences
  - pymdownx.highlight
  - toc: { permalink: false }
  - pymdownx.emoji:           # :material-x: icons, inlined as SVG at build time, so offline
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
