# Built by install/site.sh into store/site. docs/reference.md is generated there, not here.
site_name: pyark
site_url: http://localhost:8800/
use_directory_urls: true
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle: { icon: material/weather-night, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle: { icon: material/weather-sunny, name: Light }
  features: [navigation.sections, navigation.footer, search.highlight, content.code.copy]
nav:
  - Home: index.md
  - Start a project: start-a-project.md
  - Add a library or tool: add-a-library.md
  - Working offline: offline.md
  - Tools: tools.md
  - Editor (nvim): nvim.md
  - Reference docs: reference.md
plugins: [search]
markdown_extensions: [admonition, tables, pymdownx.superfences, pymdownx.highlight, toc]
